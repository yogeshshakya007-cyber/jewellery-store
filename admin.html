<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogesh Jewellers | Admin Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Montserrat', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif !important; }
        .menu-active { background: linear-gradient(135deg, #e6998c, #d8897c); color: white; box-shadow: 0 4px 15px rgba(230, 153, 140, 0.4); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-checkbox:checked { background-color: #059669; border-color: #059669; }
        .img-upload-box { border: 2px dashed #e5e7eb; transition: all 0.3s ease; }
        .img-upload-box:hover { border-color: #e6998c; background-color: #fff9f8; }
        .img-preview { object-fit: cover; width: 100%; height: 100%; position: absolute; top: 0; left: 0; border-radius: 0.375rem; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- ========================================== -->
    <!-- FIXED LOGIN MODAL (KEYBOARD FIX) -->
    <!-- ========================================== -->
    <div id="login-modal" class="fixed inset-0 z-[9999] bg-[#0f172a] flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white p-8 md:p-10 rounded-2xl w-full max-w-md shadow-2xl text-center my-auto">
            <h1 class="text-3xl font-extrabold text-[#e6998c] tracking-widest uppercase font-serif mb-2">Yogesh</h1>
            <p class="text-gray-500 text-sm mb-8 tracking-widest uppercase">Admin Secure Portal</p>
            
            <div class="text-left mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Admin Password</label>
                <div class="relative">
                    <i class="ph ph-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-xl"></i>
                    <input type="password" id="admin-pass" placeholder="Enter your password" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg outline-none focus:border-[#e6998c] focus:ring-1 focus:ring-[#e6998c] transition-all text-base">
                </div>
            </div>
            
            <button onclick="checkLogin()" class="w-full bg-black hover:bg-gray-800 text-white py-3.5 rounded-lg font-bold tracking-wide uppercase transition-colors shadow-lg">Secure Login</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MAIN ADMIN DASHBOARD -->
    <!-- ========================================== -->
    <div id="admin-panel" class="hidden h-full w-full relative flex-row overflow-hidden bg-gray-50">
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity"></div>
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-[260px] md:w-[280px] bg-[#0f172a] text-gray-300 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl md:shadow-none h-full">
            <div class="p-5 border-b border-gray-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#e6998c] text-white flex items-center justify-center text-xl font-serif font-bold shrink-0">Y</div>
                    <div>
                        <h2 class="text-lg font-bold text-white tracking-wider leading-tight">YOGESH</h2>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest">Admin Panel</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1"><i class="ph ph-x text-2xl font-bold"></i></button>
            </div>
            <nav class="p-4 space-y-2 flex-grow overflow-y-auto hide-scrollbar">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="menu-active w-full p-3.5 rounded-xl text-left font-bold flex items-center gap-3 text-white"><i class="ph ph-squares-four text-xl"></i> Dashboard</button>
                <button onclick="switchTab('products')" id="tab-products" class="w-full p-3.5 hover:bg-gray-800 rounded-xl text-left font-bold flex items-center gap-3 text-gray-300"><i class="ph ph-sketch-logo text-xl"></i> Products</button>
                <button onclick="switchTab('orders')" id="tab-orders" class="w-full p-3.5 hover:bg-gray-800 rounded-xl text-left font-bold flex items-center gap-3 text-gray-300"><i class="ph ph-shopping-bag text-xl"></i> Orders</button>
                <div class="w-full h-px bg-gray-800 my-6"></div>
                <button onclick="logout()" class="w-full p-3.5 hover:bg-red-500/10 hover:text-red-500 rounded-xl text-left font-bold flex items-center gap-3 text-gray-400"><i class="ph ph-sign-out text-xl"></i> Logout</button>
            </nav>
        </aside>

        <main class="w-full md:pl-[280px] min-h-screen flex flex-col">
            <header class="bg-white/90 backdrop-blur-md border-b border-gray-100 p-4 md:p-6 flex items-center sticky top-0 z-30 shadow-sm">
                <button onclick="toggleSidebar()" class="md:hidden mr-4 text-gray-800 p-1"><i class="ph ph-list text-3xl font-bold"></i></button>
                <div>
                    <h1 id="page-title" class="text-xl md:text-2xl font-bold text-gray-900">Dashboard Overview</h1>
                </div>
            </header>

            <div class="w-full p-4 md:p-8">
                <div id="section-dashboard" class="space-y-6 max-w-7xl mx-auto">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="bg-white p-6 rounded-2xl border flex items-center gap-4">
                            <div class="text-2xl"><i class="ph ph-currency-inr"></i></div>
                            <div><p class="text-xs font-bold text-gray-500">Revenue</p><h3 id="stat-revenue" class="text-2xl font-extrabold">₹0</h3></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border flex items-center gap-4">
                            <div class="text-2xl"><i class="ph ph-shopping-cart"></i></div>
                            <div><p class="text-xs font-bold text-gray-500">Orders</p><h3 id="stat-orders-count" class="text-2xl font-extrabold">0</h3></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border flex items-center gap-4">
                            <div class="text-2xl"><i class="ph ph-sketch-logo"></i></div>
                            <div><p class="text-xs font-bold text-gray-500">Products</p><h3 id="stat-products-count" class="text-2xl font-extrabold">0</h3></div>
                        </div>
                    </div>
                </div>

                <div id="section-products" class="hidden space-y-6 max-w-7xl mx-auto">
                    <button onclick="openProductModal()" class="menu-active px-6 py-3 rounded-lg font-bold">Add New Product</button>
                    <div class="overflow-x-auto bg-white rounded-xl border">
                        <table class="w-full text-left text-sm" id="products-table-body"></table>
                    </div>
                </div>

                <div id="section-orders" class="hidden space-y-6 max-w-7xl mx-auto">
                    <div class="overflow-x-auto bg-white rounded-xl border p-4">
                        <table class="w-full text-left text-sm" id="orders-table-body"></table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal & Scripts remain same as previous working logic -->
    <script>
        // ... (Keep your existing JS logic here) ...
    </script>
</body>
</html>
