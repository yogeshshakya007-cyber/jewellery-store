<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogesh Jewellers | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Montserrat', sans-serif; }
        /* Keyboard Fix: Login container uses flex with min-height to stay centered */
        #login-modal { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .menu-active { background: linear-gradient(135deg, #e6998c, #d8897c); color: white; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .img-upload-box { border: 2px dashed #e5e7eb; transition: all 0.3s ease; }
        .img-preview { object-fit: cover; width: 100%; height: 100%; position: absolute; top: 0; left: 0; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 m-0 p-0">

    <!-- ========================================== -->
    <!-- KEYBOARD-FRIENDLY LOGIN MODAL -->
    <!-- ========================================== -->
    <div id="login-modal" class="fixed inset-0 z-[9999] bg-[#0f172a] overflow-y-auto">
        <div class="w-full max-w-md mx-auto p-4 my-auto">
            <div class="bg-white p-8 md:p-10 rounded-2xl shadow-2xl text-center">
                <h1 class="text-3xl font-extrabold text-[#e6998c] tracking-widest uppercase font-serif mb-2">Yogesh</h1>
                <p class="text-gray-500 text-sm mb-8 tracking-widest uppercase">Admin Secure Portal</p>
                
                <div class="text-left mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Admin Password</label>
                    <div class="relative">
                        <i class="ph ph-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-xl"></i>
                        <input type="password" id="admin-pass" placeholder="Enter password" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg outline-none focus:border-[#e6998c] text-[16px]">
                    </div>
                </div>
                <button onclick="checkLogin()" class="w-full bg-black hover:bg-gray-800 text-white py-3.5 rounded-lg font-bold tracking-wide uppercase transition-colors">Secure Login</button>
            </div>
        </div>
    </div>

    <!-- MAIN PANEL AND OTHER CODE REMAINS THE SAME AS BEFORE -->
    <div id="admin-panel" class="hidden h-full w-full bg-gray-50">
        <!-- (आपका बाकी डैशबोर्ड कोड यहाँ रखें) -->
    </div>

    <script>
        // (आपका पिछला JS लॉजिक यहाँ रखें)
        function checkLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "123") {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else { alert("Incorrect Password!"); }
        }
    </script>
</body>
</html>
