<div id="product-modal" class="fixed inset-0 z-[9999] bg-black/60 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl w-full max-w-4xl shadow-2xl p-6">
        <h2 class="text-xl font-extrabold mb-6">✨ नया प्रॉडक्ट जोड़ें (+ Add New Product)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
            <input type="text" id="add-p-name" placeholder="Product Name *" class="p-3 border rounded-lg">
            <input type="text" id="add-p-category" placeholder="Category *" class="p-3 border rounded-lg">
            <input type="text" id="add-p-sku" placeholder="SKU ID *" class="p-3 border rounded-lg">
        </div>

        <!-- 5 Image Upload Boxes -->
        <div class="grid grid-cols-5 gap-4 mb-6">
            <input type="file" id="file-1" class="hidden" onchange="handleImage(this, 1)">
            <div onclick="document.getElementById('file-1').click()" class="border-2 border-dashed h-24 flex items-center justify-center cursor-pointer">Photo 1 *</div>
            
            <input type="file" id="file-2" class="hidden" onchange="handleImage(this, 2)">
            <div onclick="document.getElementById('file-2').click()" class="border-2 border-dashed h-24 flex items-center justify-center cursor-pointer">Photo 2</div>
            
            <input type="file" id="file-3" class="hidden" onchange="handleImage(this, 3)">
            <div onclick="document.getElementById('file-3').click()" class="border-2 border-dashed h-24 flex items-center justify-center cursor-pointer">Photo 3</div>
            
            <input type="file" id="file-4" class="hidden" onchange="handleImage(this, 4)">
            <div onclick="document.getElementById('file-4').click()" class="border-2 border-dashed h-24 flex items-center justify-center cursor-pointer">Photo 4</div>
            
            <input type="file" id="file-5" class="hidden" onchange="handleImage(this, 5)">
            <div onclick="document.getElementById('file-5').click()" class="border-2 border-dashed h-24 flex items-center justify-center cursor-pointer">Photo 5</div>
        </div>

        <button onclick="saveProduct()" id="submit-btn" class="w-full bg-green-600 text-white p-4 rounded-lg font-bold">SAVE PRODUCT</button>
    </div>
</div>

<script>
    let uploadedUrls = { 1: null, 2: null, 3: null, 4: null, 5: null };

    async function handleImage(input, id) {
        const file = input.files[0];
        const fileName = Date.now() + '_' + file.name;
        
        const { data, error } = await supabaseClient.storage
            .from('product-images')
            .upload(fileName, file);

        if (error) { alert("Upload Failed: " + error.message); return; }
        
        const { data: publicData } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
        uploadedUrls[id] = publicData.publicUrl;
        alert("Image " + id + " Uploaded!");
    }

    async function saveProduct() {
        const name = document.getElementById('add-p-name').value;
        // ... बाकी डेटा इकट्ठा करें
        
        const { error } = await supabaseClient.from('products').insert([{
            name: name,
            image_url: uploadedUrls[1],
            image_2: uploadedUrls[2],
            image_3: uploadedUrls[3],
            image_4: uploadedUrls[4],
            image_5: uploadedUrls[5],
            // ... अन्य कॉलम
        }]);
        
        if (error) alert("Error: " + error.message);
        else { alert("Product Saved!"); location.reload(); }
    }
</script>
