<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogesh Jewellers | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .menu-active { background: linear-gradient(135deg, #e6998c, #d8897c); color: white; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- LOGIN OVERLAY -->
    <div id="login-modal" class="fixed inset-0 z-[9999] bg-gray-900 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
            <input type="password" id="admin-pass" placeholder="Enter Admin Password" class="w-full p-3 border rounded-lg mb-4 outline-none focus:border-[#e6998c]">
            <button onclick="checkLogin()" class="w-full bg-black text-white py-3 rounded-lg font-bold">Login</button>
        </div>
    </div>

    <!-- MAIN CONTENT (HIDDEN UNTIL LOGIN) -->
    <div id="admin-panel" class="hidden">
        <!-- Sidebar and Content Structure -->
        <div class="flex">
            <!-- Sidebar (Desktop/Mobile) -->
            <aside class="w-[280px] h-screen bg-[#0f172a] text-white p-6 fixed lg:relative hidden lg:block">
                <h1 class="text-2xl font-bold text-[#e6998c] mb-10 font-serif">YOGESH</h1>
                <nav class="space-y-4">
                    <button class="menu-active w-full p-4 rounded-xl text-left font-bold flex items-center gap-3">📊 Overview</button>
                    <button onclick="alert('Products Management coming soon!')" class="w-full p-4 hover:bg-gray-800 rounded-xl text-left font-bold flex items-center gap-3">💍 Products</button>
                    <button onclick="alert('Orders Management coming soon!')" class="w-full p-4 hover:bg-gray-800 rounded-xl text-left font-bold flex items-center gap-3">📦 Orders</button>
                </nav>
            </aside>

            <!-- Dashboard Content -->
            <main class="flex-1 p-6 lg:p-10">
                <h2 class="text-3xl font-bold mb-8">Overview Dashboard</h2>
                
                <!-- Stat Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border">
                        <p class="text-gray-500 text-sm">Total Sales</p>
                        <h3 id="stat-sales" class="text-2xl font-bold mt-1">₹0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border">
                        <p class="text-gray-500 text-sm">Total Orders</p>
                        <h3 id="stat-orders" class="text-2xl font-bold mt-1">0</h3>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <canvas id="salesChart" height="200"></canvas>
                </div>
            </main>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "123"; // अपना सीक्रेट पासवर्ड यहाँ रखें

        function checkLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadDashboardData();
            } else {
                alert("गलत पासवर्ड!");
            }
        }

        const supabaseUrl = 'https://fzzwioyhmuanfvpotfit.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6endpb3lobXVhbmZ2cG90Zml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MDAxODYsImV4cCI6MjA5OTM3NjE4Nn0.y-eyWjY4oO8PbpiARC4RVy48256QUHfYn4BOZi2DdSQ';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function loadDashboardData() {
            // Fetch Orders
            const { data: orders } = await supabase.from('orders').select('*');
            
            // Calculate Total Sales
            let total = orders.reduce((sum, o) => sum + parseInt(o.total_amount.replace('₹','').replace(',','')), 0);
            
            document.getElementById('stat-sales').innerText = "₹" + total.toLocaleString('en-IN');
            document.getElementById('stat-orders').innerText = orders.length;
        }
    </script>
</body>
</html>
